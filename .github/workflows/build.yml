name: Build Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test input decoding and persistence
        run: dotnet run --project tests/WowMouseMapper.Tests.csproj -c Release
      - name: Publish portable Windows app
        run: dotnet publish src/WowMouseMapper/WowMouseMapper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: WOW-Mouse-Mapper-win-x64
          path: artifacts/win-x64/
